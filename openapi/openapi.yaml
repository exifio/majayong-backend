openapi: 3.1.0
info:
  title: 마자용 API (전체 라우트)
  version: 0.7.0
  description: |
    실서버 라우트 133개 operation. 성공은 {data} 또는 {data,meta}, 오류는
    {error:{code,message,requestId}}. 모든 경로는 Authorization Bearer가 필요하다.
    생성된 항목은 `x-response-dto: 부분 응답 - 미검증`이며 DTO는 코드 대조 후 확정한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: application
  - name: market
  - name: chat
  - name: agreement
  - name: contract
  - name: notification
  - name: report
  - name: admin
  - name: support
  - name: auth
  - name: delivery
  - name: draft
  - name: files
  - name: health
  - name: integration
  - name: profile
  - name: project
paths:
  /projects/{projectId}/applications:
    get:
      operationId: listProjectApplications
      tags: [application]
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierApplicationCardDto'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: submitApplication
      tags: [application]
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitApplication'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ApplicationRevisionDto'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
