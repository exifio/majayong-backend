components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access-token
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    applicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
    contractId:
      name: contractId
      in: path
      required: true
      schema: { type: string }
    notificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
    messageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    reportId:
      name: reportId
      in: path
      required: true
      schema: { type: string }
    inquiryId:
      name: inquiryId
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50 }
    after:
      name: after
      in: query
      schema: { type: string, format: date-time }
    unreadOnly:
      name: unreadOnly
      in: query
      schema: { type: boolean }
    status:
      name: status
      in: query
      schema: { type: string }
  responses:
    Unauthenticated:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 권한 거부
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 없거나 비공개
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 상태 충돌·중복
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    SubmitApplication:
      type: object
      additionalProperties: false
      required: [totalAmount, durationDays, items]
      properties:
        totalAmount: { type: integer, minimum: 1 }
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        message: { type: [string, 'null'], maxLength: 4000 }
        questions:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 500 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [specItemId, isAvailable]
            properties:
              specItemId: { type: string }
              isAvailable: { type: boolean }
    ReviseApplication:
      type: object
      additionalProperties: false
      required: [totalAmount, durationDays, items, revisionReason]
      properties:
        totalAmount: { type: integer, minimum: 1 }
        durationDays: { type: integer, minimum: 1, maximum: 3650 }
        message: { type: [string, 'null'], maxLength: 4000 }
        questions:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 500 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [specItemId, isAvailable]
            properties:
              specItemId: { type: string }
              isAvailable: { type: boolean }
        revisionReason: { type: string, minLength: 1, maxLength: 200 }
    SendMessage:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    SignContract:
      type: object
      additionalProperties: false
      required: [expectedContentHash]
      properties:
        expectedContentHash: { type: string, minLength: 1, maxLength: 128 }
    SubmitReport:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [CONTACT_OR_OFFSITE, ABUSE, FALSE_INFO, OTHER]
        detail: { type: [string, 'null'], maxLength: 2000 }
    ResolveReport:
      type: object
      additionalProperties: false
      required: [action, actionNote]
      properties:
        action:
          type: string
          enum: [NONE, WARNING, CHAT_RESTRICT_7D, SUSPEND]
        actionNote: { type: string, minLength: 1, maxLength: 2000 }
    CreateInquiry:
      type: object
      additionalProperties: false
      required: [category, title, body]
      properties:
        category:
          type: string
          enum: [USAGE, PAYMENT, INSPECTION, CANCEL, ACCOUNT, OTHER]
        contractId: { type: [string, 'null'], maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        attachments:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [url, name, size]
            properties:
              url: { type: string, minLength: 1, maxLength: 2048 }
              name: { type: string, minLength: 1, maxLength: 255 }
              size: { type: integer, minimum: 1, maximum: 10485760 }
    AnswerInquiry:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 5000 }
    ApplicationRecordDto:
      type: object
      required: [id, projectId, clientUserId, supplierId, revisionNo, specVersionNo, status, totalAmount, durationDays, firstViewedAt, submittedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        clientUserId: { type: string }
        supplierId: { type: string }
        revisionNo: { type: integer }
        specVersionNo: { type: integer }
        status: { type: string, enum: [SUBMITTED, STALE, ACCEPTED, REJECTED, AUTO_REJECTED, WITHDRAWN, SUPERSEDED] }
        totalAmount: { type: integer }
        durationDays: { type: integer }
        firstViewedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
    ApplicationRevisionDto:
      allOf:
        - $ref: '#/components/schemas/ApplicationRecordDto'
        - type: object
          required: [message, questions, isMessageMasked, revisionReason, items]
          properties:
            message: { type: [string, 'null'] }
            questions:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text: { type: string }
            isMessageMasked: { type: boolean }
            revisionReason: { type: [string, 'null'] }
            items:
              type: array
              items:
                type: object
                required: [specItemId, isAvailable]
                properties:
                  specItemId: { type: string }
                  isAvailable: { type: boolean }
    SupplierApplicationCardDto:
      type: object
      required: [applicationId, supplierId, supplierName, revisionNo, totalAmount, clientFee, depositAmount, firstRevisionAmount, durationDays, questionCount, revisionCount, submittedAt, careerYears, ratingAvg, reviewCount, completedContractCount, portfolioSummary]
      properties:
        applicationId: { type: string }
        supplierId: { type: string }
        supplierName: { type: [string, 'null'] }
        revisionNo: { type: integer }
        totalAmount: { type: integer }
        clientFee: { type: integer }
        depositAmount: { type: integer }
        firstRevisionAmount: { type: integer }
        durationDays: { type: integer }
        questionCount: { type: integer }
        revisionCount: { type: integer }
        submittedAt: { type: string, format: date-time }
        careerYears: { type: [integer, 'null'] }
        ratingAvg: { type: [number, 'null'] }
        reviewCount: { type: integer }
        completedContractCount: { type: integer }
        portfolioSummary: { type: [string, 'null'] }
    ApplicationStatusResultDto:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [SUBMITTED, STALE, ACCEPTED, REJECTED, AUTO_REJECTED, WITHDRAWN, SUPERSEDED] }
    RemoveBookmarkResultDto:
      type: object
      required: [removed]
      properties:
        removed: { type: boolean }
    OpenChatResultDto:
      type: object
      required: [opened]
      properties:
        opened: { type: boolean }
    ReviseApplicationResultDto:
      type: object
      required: [previous, current]
      properties:
        previous: { $ref: '#/components/schemas/ApplicationRevisionDto' }
        current: { $ref: '#/components/schemas/ApplicationRevisionDto' }
    HopeBudgetRangeDto:
      type: object
      required: [minKrw, maxKrw]
      properties:
        minKrw: { type: integer }
        maxKrw: { type: integer }
    PublicProjectSummaryDto:
      type: object
      required: [id, title, summary, industryCode, requiredSkills, hopeBudgetRange, deadline, status, publishedAt, currentSpecVersion, specItemCount, specItemTitles]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        industryCode: { type: string }
        requiredSkills:
          type: array
          items: { type: string }
        hopeBudgetRange:
          oneOf:
            - $ref: '#/components/schemas/HopeBudgetRangeDto'
            - type: 'null'
        deadline:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        status: { type: string, enum: [SCHEDULED, RECRUITING, SELECTING, ACCEPTED, CONTRACTED, EXPIRED] }
        publishedAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        currentSpecVersion: { type: integer }
        specItemCount: { type: integer }
        specItemTitles:
          type: array
          items: { type: string }
    RecommendedProjectDto:
      type: object
      required: [project, matchedSkills]
      properties:
        project: { $ref: '#/components/schemas/PublicProjectSummaryDto' }
        matchedSkills:
          type: array
          items: { type: string }
    BookmarkDto:
      type: object
      required: [supplierId, projectId, createdAt]
      properties:
        supplierId: { type: string }
        projectId: { type: string }
        createdAt: { type: string, format: date-time }
    BookmarkListItemDto:
      type: object
      required: [project, createdAt, applicationOpen]
      properties:
        project: { $ref: '#/components/schemas/PublicProjectSummaryDto' }
        createdAt: { type: string, format: date-time }
        applicationOpen: { type: boolean }
    ChatApplicationDto:
      type: object
      required: [id, projectId, clientUserId, supplierId, status, contractStatus]
      properties:
        id: { type: string }
        projectId: { type: string }
        clientUserId: { type: string }
        supplierId: { type: string }
        status: { type: string, enum: [SUBMITTED, STALE, ACCEPTED, REJECTED, AUTO_REJECTED, WITHDRAWN, SUPERSEDED] }
        contractStatus:
          oneOf:
            - { type: string, enum: [PENDING_CONSENT, ACTIVE, CANCEL_REQUESTED, COMPLETED, CANCELLED] }
            - type: 'null'
    ChatMessageDto:
      type: object
      required: [id, applicationId, senderId, kind, body, isMasked, readAt, createdAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        senderId:
          oneOf:
            - { type: string }
            - type: 'null'
        kind: { type: string, enum: [TEXT, SYSTEM] }
        body:
          type: string
          description: 계약 ACTIVE 전에는 연락처 원문이 서버에서 `[연락처 비공개]`로 치환되어 저장·반환된다. FE는 이 문자열을 자체 표시 토큰으로 매핑한다.
        isMasked:
          type: boolean
          description: 본문에 `[연락처 비공개]` 치환이 포함되면 true.
        readAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        createdAt: { type: string, format: date-time }
    ChatRoomSummaryDto:
      allOf:
        - $ref: '#/components/schemas/ChatApplicationDto'
        - type: object
          required: [projectTitle, counterpartDisplayName, lastMessage, unreadCount]
          properties:
            projectTitle: { type: string }
            counterpartDisplayName: { type: string }
            lastMessage:
              oneOf:
                - $ref: '#/components/schemas/ChatMessageDto'
                - type: 'null'
            unreadCount: { type: integer }
    ConversationViewDto:
      type: object
      required: [messages, unreadCount]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessageDto' }
        unreadCount: { type: integer }
    AgreementConditionDto:
      type: object
      required: [key, text, state, evidenceMessageIds]
      properties:
        key: { type: string }
        text: { type: string }
        state: { type: string, enum: [DECIDED, PROPOSED, UNDECIDED] }
        evidenceMessageIds:
          type: array
          items: { type: string }
    AgreementItemDto:
      type: object
      required: [blockId, specItemId, title, stage, conditions]
      properties:
        blockId: { type: string }
        specItemId:
          oneOf:
            - { type: string }
            - type: 'null'
        title: { type: string }
        stage: { type: string, enum: [INTERIM, FINAL] }
        conditions:
          type: array
          items: { $ref: '#/components/schemas/AgreementConditionDto' }
    AgreementDraftDto:
      type: object
      required: [items, interimRatio, ratioState, cachedAt, lastMessageAt]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgreementItemDto' }
        interimRatio: { type: number }
        ratioState: { type: string, enum: [DECIDED, PROPOSED, UNDECIDED] }
        cachedAt: { type: string, format: date-time }
        lastMessageAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
    AgreementPreviewDto:
      type: object
      required: [draft, stale, readOnly]
      properties:
        draft: { $ref: '#/components/schemas/AgreementDraftDto' }
        stale: { type: boolean }
        readOnly: { type: boolean, const: true }
    ContractItemDto:
      type: object
      required: [id, blockId, title, description, origin, stage, sortOrder, conditions]
      properties:
        id: { type: string }
        blockId: { type: string }
        title: { type: string }
        description: { type: string }
        origin: { type: string, enum: [FIRST_SENTENCE, CHAT, RECOMMENDATION, DEFAULT_DRAFT, AGREEMENT] }
        stage: { type: string, enum: [INTERIM, FINAL] }
        sortOrder: { type: integer }
        conditions:
          type: array
          items: { $ref: '#/components/schemas/AgreementConditionDto' }
    ContractRecordDto:
      type: object
      required: [id, applicationId, projectId, clientUserId, supplierId, status, specVersionNo, agreedAmount, durationDays, clientFee, supplierFee, interimRatio, consentDeadline, contentHash, clientSignedAt, supplierSignedAt, depositDeadline, paymentStatus, totalDeposited, items]
      properties:
        id: { type: string }
        applicationId: { type: string }
        projectId: { type: string }
        clientUserId: { type: string }
        supplierId: { type: string }
        status: { type: string, enum: [PENDING_CONSENT, ACTIVE, CANCEL_REQUESTED, COMPLETED, CANCELLED] }
        specVersionNo: { type: integer }
        agreedAmount: { type: integer }
        durationDays: { type: integer }
        clientFee: { type: integer }
        supplierFee: { type: integer }
        interimRatio: { type: number }
        consentDeadline: { type: string, format: date-time }
        contentHash: { type: string }
        clientSignedAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        supplierSignedAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        depositDeadline:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        paymentStatus: { type: string, enum: [PENDING, DEPOSITED, PARTIALLY_RELEASED, RELEASED, REFUNDED] }
        totalDeposited: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContractItemDto' }
    ProvisionalContractPlanDto:
      type: object
      required: [applicationId, projectId, specVersionNo, agreedAmount, durationDays, clientFee, supplierFee, interimRatio, consentDeadline, contentHash, items]
      properties:
        applicationId: { type: string }
        projectId: { type: string }
        specVersionNo: { type: integer }
        agreedAmount: { type: integer }
        durationDays: { type: integer }
        clientFee: { type: integer }
        supplierFee: { type: integer }
        interimRatio: { type: number }
        consentDeadline: { type: string, format: date-time }
        contentHash: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContractItemDto' }
    ConfirmAgreementResultDto:
      type: object
      required: [contract, plan]
      properties:
        contract: { $ref: '#/components/schemas/ContractRecordDto' }
        plan: { $ref: '#/components/schemas/ProvisionalContractPlanDto' }
    SignContractResultDto:
      type: object
      required: [contract, activated]
      properties:
        contract: { $ref: '#/components/schemas/ContractRecordDto' }
        activated: { type: boolean }
    BreakContractResultDto:
      type: object
      required: [broken, contract, projectStatus]
      properties:
        broken: { type: boolean }
        contract:
          oneOf:
            - $ref: '#/components/schemas/ContractRecordDto'
            - type: 'null'
        projectStatus:
          oneOf:
            - { type: string, enum: [SCHEDULED, RECRUITING, SELECTING, ACCEPTED, CONTRACTED, EXPIRED] }
            - type: 'null'
    ContractDocumentDto:
      type: object
      required: [contractId, contentHash, status, agreedAmount, clientFee, supplierFee, interimRatio, depositAmount, supplierPayout, items]
      properties:
        contractId: { type: string }
        contentHash: { type: string }
        status: { type: string, enum: [PENDING_CONSENT, ACTIVE, CANCEL_REQUESTED, COMPLETED, CANCELLED] }
        agreedAmount: { type: integer }
        clientFee: { type: integer }
        supplierFee: { type: integer }
        interimRatio: { type: number }
        depositAmount: { type: integer }
        supplierPayout: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContractItemDto' }
    NotificationDto:
      type: object
      required: [id, userId, type, targetUrl, targetId, payload, isRead, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        type: { type: string }
        targetUrl: { type: string }
        targetId: { type: string }
        payload:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationReadResultDto:
      type: object
      required: [isRead]
      properties:
        isRead: { type: boolean, const: true }
    UpdatedCountDto:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    ReportDto:
      type: object
      required: [id, messageId, reporterId, targetUserId, reason, detail, status, action, actionNote, resolvedById, resolvedAt, createdAt]
      properties:
        id: { type: string }
        messageId: { type: string }
        reporterId: { type: string }
        targetUserId: { type: string }
        reason: { type: string, enum: [CONTACT_OR_OFFSITE, ABUSE, FALSE_INFO, OTHER] }
        detail:
          oneOf:
            - { type: string }
            - type: 'null'
        status: { type: string, enum: [OPEN, RESOLVED] }
        action:
          oneOf:
            - { type: string, enum: [NONE, WARNING, CHAT_RESTRICT_7D, SUSPEND] }
            - type: 'null'
        actionNote:
          oneOf:
            - { type: string }
            - type: 'null'
        resolvedById:
          oneOf:
            - { type: string }
            - type: 'null'
        resolvedAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        createdAt: { type: string, format: date-time }
    ResolveReportResultDto:
      type: object
      required: [report, warningReviewRecommended]
      properties:
        report: { $ref: '#/components/schemas/ReportDto' }
        warningReviewRecommended: { type: boolean }
    InquiryAttachmentDto:
      type: object
      required: [url, name, size]
      properties:
        url: { type: string }
        name: { type: string }
        size: { type: integer }
    InquiryDto:
      type: object
      required: [id, userId, category, contractId, title, body, attachments, status, answer, answeredById, answeredAt, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        category: { type: string, enum: [USAGE, PAYMENT, INSPECTION, CANCEL, ACCOUNT, OTHER] }
        contractId:
          oneOf:
            - { type: string }
            - type: 'null'
        title: { type: string }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/InquiryAttachmentDto' }
        status: { type: string, enum: [WAITING, ANSWERED] }
        answer:
          oneOf:
            - { type: string }
            - type: 'null'
        answeredById:
          oneOf:
            - { type: string }
            - type: 'null'
        answeredAt:
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'
        createdAt: { type: string, format: date-time }